<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
html,body{margin:0;padding:0;background:#cfc79c}
a{color:#16130a}a:hover{color:#5a4f28}
</style>
<script src="./atlas-data.js"></script>
</helmet>
<x-import component-from-global-scope="codebase-atlas" from="./atlas-engine.js" paper="{{ paper }}" flow="{{ flow }}" hint-size="100%,860px"></x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;paper&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;tan&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;tan&quot;,&quot;light&quot;,&quot;dark&quot;],&quot;section&quot;:&quot;Atlas&quot;},&quot;flow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Atlas&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      paper: this.props.paper ?? 'tan',
      flow: String(this.props.flow ?? true),
    };
  }
}
</script>
</body>
</html>
