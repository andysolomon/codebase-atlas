<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-mono);padding:18px 20px}</style><style>@keyframes fl{from{left:0}to{left:calc(100% - 6px)}}</style></head><body><div style="position:relative;height:2px;background:var(--ink);opacity:.85;max-width:420px;margin:16px 0 22px"><i style="position:absolute;top:-2.5px;width:7px;height:7px;background:var(--ink);border:1px solid var(--paper);border-radius:50%;animation:fl 3s linear infinite"></i><i style="position:absolute;top:-2.5px;width:7px;height:7px;background:var(--ink);border:1px solid var(--paper);border-radius:50%;animation:fl 3s linear infinite;animation-delay:-1.5s"></i></div><div style="height:0;border-top:1.5px dashed var(--ink);opacity:.45;max-width:420px"></div></body></html>
