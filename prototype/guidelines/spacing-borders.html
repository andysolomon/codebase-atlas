<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-mono);padding:18px 20px}</style></head><body style="display:flex;gap:36px;align-items:flex-start"><div style="display:flex;flex-direction:column;gap:12px;font-size:var(--fs-meta);letter-spacing:var(--ls-meta);color:var(--text-muted)"><div><div style="border-top:var(--border-w-hair) solid var(--ink);width:150px;margin-bottom:3px"></div>HAIR 1PX</div><div><div style="border-top:var(--border-w) solid var(--ink);width:150px;margin-bottom:3px"></div>RULE 1.5PX</div><div><div style="border-top:var(--border-w-heavy) solid var(--ink);width:150px;margin-bottom:3px"></div>HEAVY 2PX</div></div><div style="display:flex;align-items:flex-end;gap:8px"><div style="text-align:center;font-size:8px;color:var(--text-muted)"><div style="width:14px;height:4px;background:var(--ink);opacity:.8;margin:0 auto 3px"></div>4</div><div style="text-align:center;font-size:8px;color:var(--text-muted)"><div style="width:14px;height:8px;background:var(--ink);opacity:.8;margin:0 auto 3px"></div>8</div><div style="text-align:center;font-size:8px;color:var(--text-muted)"><div style="width:14px;height:12px;background:var(--ink);opacity:.8;margin:0 auto 3px"></div>12</div><div style="text-align:center;font-size:8px;color:var(--text-muted)"><div style="width:14px;height:16px;background:var(--ink);opacity:.8;margin:0 auto 3px"></div>16</div><div style="text-align:center;font-size:8px;color:var(--text-muted)"><div style="width:14px;height:20px;background:var(--ink);opacity:.8;margin:0 auto 3px"></div>20</div><div style="text-align:center;font-size:8px;color:var(--text-muted)"><div style="width:14px;height:24px;background:var(--ink);opacity:.8;margin:0 auto 3px"></div>24</div><div style="text-align:center;font-size:8px;color:var(--text-muted)"><div style="width:14px;height:32px;background:var(--ink);opacity:.8;margin:0 auto 3px"></div>32</div></div></body>
