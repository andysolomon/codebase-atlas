<!doctype html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-mono);padding:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}.sw{width:74px}.sw b{display:block;height:44px;border:1.5px solid var(--ink)}.sw i{font-style:normal;font-size:8.5px;letter-spacing:.08em;display:block;margin-top:4px;color:var(--text-muted)}</style></head><body><div class="sw"><b style="background:var(--ink)"></b><i>INK 100%</i></div><div class="sw"><b style="background:var(--ink-dim)"></b><i>DIM 55%</i></div><div class="sw"><b style="background:var(--ink-hair)"></b><i>HAIR 28%</i></div><div class="sw"><b style="background:var(--ink-faint)"></b><i>FAINT 16%</i></div></body></html>
